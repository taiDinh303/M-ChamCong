# Reference for the existing service; this file does not bind a manually created service.
# Do not create another service or deploy automatically. See docs/CONFIGURATION-STANDARD.md.
services:
  - type: web
    name: marixa001_asp
    runtime: docker
    dockerfilePath: ./marixa_aspnet/Dockerfile
    dockerContext: ./marixa_aspnet
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE__PROVIDER
        value: PostgreSQL
      - key: CONNECTIONSTRINGS__MYCNN
        sync: false
      - key: JWTSETTINGS__KEY
        sync: false
      - key: CORS__ALLOWEDORIGINS__0
        value: https://marixa001.vercel.app
      - key: APPSETTINGS__CLIENTURL
        value: https://marixa001.vercel.app
      - key: SUPABASE__URL
        value: https://zphqfcwrwitrqdeueonu.supabase.co
      - key: SUPABASE__SERVICE_KEY
        sync: false
      - key: BACKGROUNDJOBS__ENABLED
        value: "true"
