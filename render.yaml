# Render Blueprint — M-ChamCong
# Tạo cả 3 service bằng 1 nút: PostgreSQL + API (Docker) + Web (static).
# Render dashboard -> New -> Blueprint -> chọn repo -> Apply
databases:
  - name: m-chamcon-db
    plan: free
    databaseName: m_chamcon

services:
  - name: m-chamcon-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__Provider
        value: PostgreSQL
      - key: ConnectionStrings__MyCnn
        fromDatabase:
          name: m-chamcon-db
          property: connectionString
      - key: JwtSettings__Key
        value: "CHANGE-ME-TO-A-LONG-RANDOM-SECRET-MIN-32-CHARS"
      - key: JwtSettings__Issuer
        value: "API"
      - key: JwtSettings__Audience
        value: "APIUser"
      # .NET map "__" -> ":", và 0 là index mảng
      - key: "Cors__AllowedOrigins__0"
        value: "https://m-chamcon-web.onrender.com"
    healthCheckPath: /swagger/v1/swagger.json

  - name: m-chamcon-web
    type: web
    runtime: static
    staticPublishPath: ./ChamCong/dist
    buildCommand: cd ChamCong && npm install --no-audit --no-fund && npm run build
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://m-chamcon-api.onrender.com/api"
    # Sau khi tạo: Settings -> Redirects/Rewrites -> Rewrite /* -> /index.html (SPA)
    # API -> Disks -> Attach Disk mount /app/wwwroot/uploads (giữ ảnh chấm công)
