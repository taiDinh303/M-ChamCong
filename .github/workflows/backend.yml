name: Backend verification

on:
  push:
    paths: ["marixa_aspnet/**", "docs/**", "scripts/**", "deploy/**", "render.yaml", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["marixa_aspnet/**", "docs/**", "scripts/**", "deploy/**", "render.yaml", ".github/workflows/backend.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marixa_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MARIXA_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=marixa_test;Password=isolated_ci_only
      MARIXA_ARTIFACT_DIR: ${{ github.workspace }}/TestResults/artifacts
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore marixa_aspnet/M.BE.sln -warnaserror
      - run: dotnet build marixa_aspnet/M.BE.sln -c Release --no-restore -warnaserror
      - run: dotnet test marixa_aspnet/M.BE.sln -c Release --no-build --logger trx --results-directory TestResults
      - run: python3 scripts/verify_docs.py
      - run: pwsh -NoProfile -File scripts/Test-CloudEnvironmentExport.ps1
      - run: pwsh -NoProfile -File scripts/Test-ProductionConfiguration.ps1
      - run: docker build -f marixa_aspnet/Dockerfile -t marixa-backend-verify marixa_aspnet
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-results
          path: TestResults/
